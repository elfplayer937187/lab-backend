# Ruff 配置:同时负责格式化(ruff format)和静态检查(ruff check)
# 与 .vscode/settings.json 中的 [python] 段配合使用

line-length = 100
target-version = "py313"

# 顶层选项:缩进宽度(ruff 默认也是 4,这里显式写出)
indent-width = 4

# ---------- 格式化 ----------
[format]
# 单引号,与项目规范一致(见 .claude/CLAUDE.md 第 6 节)
quote-style = "single"
indent-style = "space"
# 跟随文件原有的换行符,避免在 Windows 上产生整文件 diff
line-ending = "auto"
skip-magic-trailing-comma = false

# ---------- 静态检查 ----------
[lint]
# E4/E7/E9/F 是 ruff 默认规则集;I 负责 import 排序
select = ["E4", "E7", "E9", "F", "I"]
# 行宽交给 formatter 处理,避免重复告警
ignore = ["E501"]

[lint.isort]
known-first-party = ["app"]
